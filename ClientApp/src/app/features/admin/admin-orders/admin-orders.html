<div class="admin-container">
  <h1>Manage Orders</h1>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <table mat-table [dataSource]="orders()" class="full-width">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Order #</th>
      <td mat-cell *matCellDef="let o">{{ o.id }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let o">{{ o.guestEmail }}</td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let o">${{ o.totalAmount.toFixed(2) }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let o">
        <mat-form-field appearance="outline" class="status-select">
          <mat-select [ngModel]="o.status" (ngModelChange)="updateStatus(o.id, o.status, $event)">
            @for (s of statuses; track s) {
              <mat-option [value]="s" [class.cancelled-option]="s === 'Cancelled'">{{ s }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let o">{{ o.createdAt | date:'short' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
</div>
