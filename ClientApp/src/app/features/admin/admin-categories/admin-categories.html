<div class="admin-container">
  <div class="header-row">
    <h1>Manage Categories</h1>
    <button mat-raised-button color="primary" (click)="startCreate()">+ New Category</button>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (editingId() !== null) {
    <mat-card class="edit-form">
      <h3>{{ editingId() === -1 ? 'New Category' : 'Edit Category' }}</h3>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="form.name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Slug</mat-label>
        <input matInput [(ngModel)]="form.slug" />
      </mat-form-field>

      <div class="form-actions">
        <button mat-button (click)="cancelEdit()">Cancel</button>
        <button mat-raised-button color="primary" (click)="save()">Save</button>
      </div>
    </mat-card>
  }

  <table mat-table [dataSource]="categories()" class="full-width">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let c">{{ c.name }}</td>
    </ng-container>

    <ng-container matColumnDef="slug">
      <th mat-header-cell *matHeaderCellDef>Slug</th>
      <td mat-cell *matCellDef="let c">{{ c.slug }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button (click)="startEdit(c)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deleteCategory(c.id)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
</div>
