<div class="detail-container">
  @if (loading()) {
    <mat-spinner></mat-spinner>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
    <a routerLink="/">← Back to products</a>
  }

  @if (product(); as p) {
    <a routerLink="/" class="back-link">← Back to products</a>

    <mat-card class="detail-card">
      <mat-card-header>
        <mat-card-title>{{ p.name }}</mat-card-title>
        <mat-card-subtitle>{{ p.categoryName }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ p.description }}</p>
        <p class="price">${{ p.price.toFixed(2) }}</p>
        <p class="stock-badge" [class.out-of-stock]="!p.inStock">
          {{ p.inStock ? 'In Stock' : 'Out of Stock' }}
        </p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" [disabled]="!p.inStock" (click)="addToCart(p)">
        Add to Cart
        </button>
      </mat-card-actions>
    </mat-card>
  }
</div>
